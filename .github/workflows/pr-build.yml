name: PR build
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Build Angular (demo)
        run: npm run build
      - name: Build Angular (API mode)
        run: npm run build:live
