<div class="heading">
  <span>♛</span>
  <h1>Choose a new password</h1>
</div>
<div class="panel reset-panel">
  <ng-container *ngIf="done(); else form">
    <p class="success-text">Your password was changed. You can sign in with it now.</p>
    <button class="primary wide" routerLink="/account">Sign in</button>
  </ng-container>
  <ng-template #form>
    <ng-container *ngIf="hasToken; else noToken">
      <form (ngSubmit)="submit()">
        <p class="helper">Use at least 12 characters. The link in your email works once.</p>
        <p class="error" *ngIf="error()" role="alert">{{ error() }}</p>
        <rt-password-field
          label="New password"
          name="newPassword"
          autocomplete="new-password"
          [minlength]="12"
          [(value)]="next"
        />
        <rt-password-field
          label="Repeat the new password"
          name="confirmPassword"
          autocomplete="new-password"
          [(value)]="confirm"
        />
        <button class="primary wide" [disabled]="saving()">
          {{ saving() ? 'Saving…' : 'Change password' }}
        </button>
      </form>
    </ng-container>
  </ng-template>
  <ng-template #noToken>
    <p>This page needs the link from your reset email. If it does not work, ask for a new one.</p>
    <button class="primary wide" routerLink="/account">Go to sign in</button>
  </ng-template>
</div>
